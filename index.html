<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 목소리 녹음</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #37352f; --muted: #787774; --line: #e9e9e7;
    --accent: #eb5757; --accent-soft: #fdecec; --ok: #0f7b6c; --ok-soft: #e6f4f1; --btn: #2383e2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --card: #252525; --text: #e6e6e4; --muted: #9b9a97; --line: #373737;
      --accent: #ff6b6b; --accent-soft: #3a2626; --ok: #4dab9a; --ok-soft: #1f3330; --btn: #529cca; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; word-break: keep-all; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .rec { text-align: center; }
  .timer { font-variant-numeric: tabular-nums; font-size: 32px; font-weight: 600; margin: 4px 0 12px; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 0 auto 18px; max-width: 280px; }
  .meter > div { height: 100%; width: 0; background: var(--accent); transition: width .08s; }
  .recbtn { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--accent); background: var(--card);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .recbtn span { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); transition: all .2s; }
  .recbtn.on span { width: 30px; height: 30px; border-radius: 6px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .err { color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-top: 14px; font-size: 13px; display: none; text-align: left; }
  .auto { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .row b { font-size: 14px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button.s { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; }
  button.s.del { color: var(--accent); }
  button.s.up { color: var(--btn); border-color: var(--btn); }
  button.s:disabled { opacity: .5; cursor: default; }
  .badge { font-size: 12px; border-radius: 6px; padding: 3px 8px; }
  .badge.ok { color: var(--ok); background: var(--ok-soft); }
  .badge.fail { color: var(--accent); background: var(--accent-soft); }
  audio { width: 100%; height: 36px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }
  details { margin-top: 28px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .set { display: flex; gap: 6px; margin-top: 10px; }
  .set input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">내 목소리 녹음</h1>
  <p class="sub" id="sub">녹음 버튼을 눌러 시작하고, 다시 눌러 멈추세요.</p>

  <section class="card rec">
    <div class="timer" id="timer">00:00</div>
    <div class="meter"><div id="level"></div></div>
    <button class="recbtn" id="recbtn" aria-label="녹음 시작"><span></span></button>
    <div class="hint" id="hint">눌러서 녹음 시작</div>
    <label class="auto" id="autowrap"><input type="checkbox" id="auto"> 녹음이 끝나면 노션에 자동 저장</label>
    <div class="err" id="err"></div>
  </section>

  <h2>내 녹음 <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
  <ul id="list"></ul>

  <details id="settings">
    <summary>⚙️ 노션 연결 설정</summary>
    <div class="set">
      <input type="password" id="secret" placeholder="비밀 문구 입력" autocomplete="off">
      <button class="s" id="savesecret">저장</button>
    </div>
    <p class="note" id="secretstate"></p>
  </details>

  <p class="note">녹음은 이 기기 브라우저에도 보관됩니다. '노션에 저장'을 누르면(또는 자동 저장이 켜져 있으면) 노션 페이지의 '내 녹음' 아래에 올라갑니다.</p>
</main>
<script>
// 배포한 Cloudflare Worker 주소
const WORKER_URL = 'https://speech-recorder.ss41490.workers.dev';

const params = new URLSearchParams(location.search);
const key = params.get('id') || 'default';
const topic = params.get('t') || '';
const pageId = /^[0-9a-f]{32}$/.test(key) ? key : '';
if (topic) {
  document.getElementById('title').textContent = '🎙️ ' + topic;
  document.title = topic + ' · 녹음';
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// IndexedDB
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('speech-recorder', 1);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore('takes', { keyPath: 'id', autoIncrement: true });
      s.createIndex('key', 'key');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('takes', mode);
    const req = fn(t.objectStore('takes'));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const addTake = take => tx('readwrite', s => s.add(take));
const putTake = take => tx('readwrite', s => s.put(take));
const delTake = id => tx('readwrite', s => s.delete(id));
const listTakes = () => tx('readonly', s => s.index('key').getAll(key));

// UI helpers
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = s => pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60));
const stamp = t => { const d = new Date(t); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const urls = [];
const sending = new Set();
function showErr(msg) { $('err').textContent = msg; $('err').style.display = 'block'; }

const canUpload = () => !!(WORKER_URL && pageId);
function refreshSettings() {
  const has = !!store.get('recorderSecret');
  $('secretstate').textContent = !WORKER_URL ? '노션 연결 서버가 아직 설정되지 않았습니다.'
    : has ? '비밀 문구가 이 기기에 저장되어 있습니다. 바꾸려면 새로 입력하세요.'
    : '처음 한 번 비밀 문구를 입력해 주세요(Cloudflare에 넣은 RECORDER_SECRET 값).';
  $('autowrap').style.display = canUpload() ? '' : 'none';
  $('auto').checked = store.get('recorderAuto') !== 'off';
}
$('auto').onchange = () => store.set('recorderAuto', $('auto').checked ? 'on' : 'off');
$('savesecret').onclick = () => {
  const v = $('secret').value.trim();
  if (!v) return;
  store.set('recorderSecret', v);
  $('secret').value = '';
  refreshSettings();
};

// WebM 등은 노션이 받지 않으므로 WAV(16kHz 모노)로 변환
async function toUploadable(blob) {
  if ((blob.type || '').startsWith('audio/mp4')) return { blob, type: 'audio/mp4' };
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close();
  const rate = 16000, len = Math.ceil(buf.duration * rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const view = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); view.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  w(36, 'data'); view.setUint32(40, pcm.length * 2, true);
  pcm.forEach((v, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 0x7fff, true));
  return { blob: new Blob([view], { type: 'audio/wav' }), type: 'audio/wav' };
}

async function upload(take, label) {
  const secret = store.get('recorderSecret');
  if (!secret) { $('settings').open = true; showErr('노션에 저장하려면 아래 "노션 연결 설정"에서 비밀 문구를 먼저 입력해 주세요.'); return false; }
  sending.add(take.id); render();
  try {
    const { blob, type } = await toUploadable(take.blob);
    if (blob.size > 5 * 1024 * 1024) throw new Error('5MB를 넘는 녹음은 노션에 올릴 수 없습니다(약 5분 이내로 녹음해 주세요).');
    const d = new Date(take.created);
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': type,
        'X-Recorder-Secret': secret,
        'X-Page-Id': pageId,
        'X-File-Name': encodeURIComponent((topic || '녹음') + '_내녹음_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes())),
        'X-Caption': encodeURIComponent(label + ' · ' + stamp(take.created) + ' · ' + fmt(take.duration || 0)),
      },
      body: blob,
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ('오류 ' + res.status));
    take.notion = 'done';
  } catch (e) {
    take.notion = 'failed';
    showErr('노션 저장 실패: ' + e.message);
  }
  sending.delete(take.id);
  await putTake(take);
  render();
  return take.notion === 'done';
}

async function render() {
  urls.splice(0).forEach(u => URL.revokeObjectURL(u));
  let takes = [];
  try { takes = await listTakes(); } catch (e) { showErr('이 브라우저에서는 녹음을 저장할 수 없습니다(사생활 보호 모드 등).'); }
  takes.sort((a, b) => b.created - a.created);
  $('count').textContent = takes.length ? takes.length + '개' : '';
  const ul = $('list');
  ul.innerHTML = '';
  if (!takes.length) {
    ul.innerHTML = '<li class="empty">아직 녹음이 없습니다.</li>';
    return;
  }
  takes.forEach((t, i) => {
    const label = (takes.length - i) + '번째 녹음';
    const li = document.createElement('li');
    const url = URL.createObjectURL(t.blob); urls.push(url);
    li.innerHTML = '<div class="row"><div><b></b> <span style="color:var(--muted)"></span></div><div class="acts"></div></div><audio controls preload="metadata"></audio>';
    li.querySelector('b').textContent = label;
    li.querySelector('span').textContent = stamp(t.created) + ' · ' + fmt(t.duration || 0);
    li.querySelector('audio').src = url;
    const acts = li.querySelector('.acts');
    if (canUpload()) {
      if (t.notion === 'done') {
        acts.insertAdjacentHTML('beforeend', '<span class="badge ok">노션에 저장됨 ✓</span>');
      } else {
        const b = document.createElement('button');
        b.className = 's up';
        b.textContent = sending.has(t.id) ? '저장 중…' : t.notion === 'failed' ? '노션에 다시 저장' : '노션에 저장';
        b.disabled = sending.has(t.id);
        b.onclick = () => upload(t, label);
        acts.appendChild(b);
      }
    }
    const dl = document.createElement('button');
    dl.className = 's'; dl.textContent = '파일 받기';
    dl.onclick = () => {
      const ext = (t.type || '').includes('mp4') ? 'm4a' : (t.type || '').includes('ogg') ? 'ogg' : 'webm';
      const a = document.createElement('a');
      a.href = url;
      a.download = (topic || '녹음') + '_내녹음_' + stamp(t.created).replace(/[.: ]/g, '') + '.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
    };
    const del = document.createElement('button');
    del.className = 's del'; del.textContent = '삭제';
    del.onclick = async () => {
      if (!confirm('이 기기에서 녹음을 삭제할까요?' + (t.notion === 'done' ? '\n(노션에 올라간 녹음은 그대로 남습니다)' : ''))) return;
      await delTake(t.id); render();
    };
    acts.append(dl, del);
    ul.appendChild(li);
  });
}

// Recording
let rec, chunks, stream, startAt, tick, ac, raf;
async function start() {
  $('err').style.display = 'none';
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    showErr('이 브라우저는 녹음을 지원하지 않습니다. 크롬·엣지·사파리 최신 버전에서 열어 주세요.');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    showErr('마이크를 사용할 수 없습니다. 주소창의 마이크 권한을 "허용"으로 바꾼 뒤 다시 눌러 주세요.');
    return;
  }
  const type = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  rec = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 96000 } : undefined);
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    const duration = (Date.now() - startAt) / 1000;
    const blob = new Blob(chunks, { type: (rec.mimeType || type || 'audio/webm').split(';')[0] });
    stream.getTracks().forEach(t => t.stop());
    let take = { key, topic, created: Date.now(), duration, type: blob.type, blob };
    try { take.id = await addTake(take); }
    catch (e) { showErr('녹음을 저장하지 못했습니다.'); }
    await render();
    if (take.id && canUpload() && $('auto').checked && store.get('recorderSecret')) {
      const n = (await listTakes()).length;
      upload(take, n + '번째 녹음');
    }
  };
  rec.start(250);
  startAt = Date.now();
  $('recbtn').classList.add('on');
  $('recbtn').setAttribute('aria-label', '녹음 멈춤');
  $('hint').textContent = '녹음 중… 다시 누르면 멈춥니다';
  tick = setInterval(() => $('timer').textContent = fmt((Date.now() - startAt) / 1000), 250);
  try {
    ac = new AudioContext();
    const an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const loop = () => {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      $('level').style.width = Math.min(100, peak / 128 * 160) + '%';
      raf = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {}
}
function stop() {
  if (rec && rec.state !== 'inactive') rec.stop();
  clearInterval(tick); cancelAnimationFrame(raf);
  if (ac) ac.close();
  $('level').style.width = '0';
  $('recbtn').classList.remove('on');
  $('recbtn').setAttribute('aria-label', '녹음 시작');
  $('hint').textContent = '눌러서 녹음 시작';
  $('timer').textContent = '00:00';
}
$('recbtn').onclick = () => (rec && rec.state === 'recording') ? stop() : start();
refreshSettings();
render();
</script>
</body>
</html>
